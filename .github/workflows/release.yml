name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v0.1.0)'
        required: true
      prerelease:
        description: 'Pre-release?'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - run: cargo build --release

      - name: Create release archives
        run: |
          mkdir -p release
          cp README.md release/
          cp zestty release/
          cp target/wasm32-wasip1/release/zestty.wasm release/

          cd release
          tar czf zestty.tar.gz zestty zestty.wasm README.md
          zip zestty.zip zestty zestty.wasm README.md
          cd ..

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.inputs.tag_name }}
          name: ${{ github.inputs.tag_name }}
          prerelease: ${{ github.inputs.prerelease }}
          generate_release_notes: false
          files: |
            release/zestty
            release/zestty.wasm
            release/zestty.tar.gz
            release/zestty.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
